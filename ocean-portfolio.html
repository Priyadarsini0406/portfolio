/* ============================================================
   WEB AUDIO API SOUND SYNTHESIZER
============================================================ */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.ambientGain = null;
    this.isPlaying = false;
  }

  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    this.ctx = new AudioCtx();

    const bufferSize = this.ctx.sampleRate * 2;
    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }

    const whiteNoise = this.ctx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(180, this.ctx.currentTime);

    this.ambientGain = this.ctx.createGain();
    this.ambientGain.gain.setValueAtTime(0.04, this.ctx.currentTime);

    whiteNoise.connect(filter);
    filter.connect(this.ambientGain);
    this.ambientGain.connect(this.ctx.destination);
    whiteNoise.start(0);
  }

  toggle(enable) {
    if (enable) {
      this.init();
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.isPlaying = true;
    } else {
      if (this.ctx && this.ctx.state === 'running') {
        this.ctx.suspend();
      }
      this.isPlaying = false;
    }
  }

  playBubble() {
    if (!this.isPlaying || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    const now = this.ctx.currentTime;
    osc.frequency.setValueAtTime(300 + Math.random() * 300, now);
    osc.frequency.exponentialRampToValueAtTime(800 + Math.random() * 400, now + 0.12);

    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.13);
  }
}

/* ============================================================
   THREE.JS 3D OCEAN SCENE
============================================================ */
function OceanCanvas({ diveProgressRef }) {
  const mountRef = useRef(null);

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount) return;
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 2000);
    camera.position.set(0, 0, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    mount.appendChild(renderer.domElement);

    scene.fog = new THREE.FogExp2(0x021018, 0.0035);

    const ambient = new THREE.AmbientLight(0x0f4c75, 1.2);
    scene.add(ambient);

    const mainLight = new THREE.DirectionalLight(0x7ff4e0, 0.9);
    mainLight.position.set(0, 100, 50);
    scene.add(mainLight);

    const particleCount = width < 768 ? 300 : 700;
    const pGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const speeds = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 450;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 700 - 100;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 350;
      speeds[i] = 0.03 + Math.random() * 0.07;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const pMat = new THREE.PointsMaterial({
      color: 0x7ff4e0, size: 1.1, transparent: true, opacity: 0.6,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    const fishGroup = new THREE.Group();
    const fishGeo = new THREE.ConeGeometry(1.5, 4.5, 4);
    fishGeo.rotateZ(Math.PI / 2);
    const fishMat = new THREE.MeshBasicMaterial({ color: 0x0a2f4d, transparent: true, opacity: 0.65 });
    const fishes = [];
    const fishCount = width < 768 ? 10 : 20;

    for (let i = 0; i < fishCount; i++) {
      const f = new THREE.Mesh(fishGeo, fishMat);
      f.position.set((Math.random() - 0.5) * 260, (Math.random() - 0.5) * 250 - 50, (Math.random() - 0.5) * 160 - 50);
      f.userData = {
        speed: 0.12 + Math.random() * 0.22,
        radius: 25 + Math.random() * 45,
        angle: Math.random() * Math.PI * 2,
        yOff: f.position.y,
        centerX: (Math.random() - 0.5) * 220,
        centerZ: (Math.random() - 0.5) * 120
      };
      fishGroup.add(f);
      fishes.push(f);
    }
    scene.add(fishGroup);

    const jellyGroup = new THREE.Group();
    for (let i = 0; i < 12; i++) {
      const g = new THREE.Group();
      const bell = new THREE.Mesh(
        new THREE.SphereGeometry(2.2 + Math.random() * 1.5, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.6),
        new THREE.MeshBasicMaterial({ color: 0x3fd8c9, transparent: true, opacity: 0.32, wireframe: true })
      );
      g.add(bell);

      const innerCore = new THREE.Mesh(
        new THREE.SphereGeometry(1.0, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0x7ff4e0, transparent: true, opacity: 0.7 })
      );
      g.add(innerCore);

      const light = new THREE.PointLight(0x3fd8c9, 1.5, 30);
      g.add(light);

      g.position.set((Math.random() - 0.5) * 240, -180 - Math.random() * 450, (Math.random() - 0.5) * 160);
      g.userData = { speed: 0.04 + Math.random() * 0.07, phase: Math.random() * Math.PI * 2 };
      jellyGroup.add(g);
    }
    scene.add(jellyGroup);

    const mouse = { x: 0, y: 0 };
    const onMouseMove = (e) => {
      mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
    };
    window.addEventListener('mousemove', onMouseMove);

    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };
    window.addEventListener('resize', onResize);

    let raf;
    const clock = new THREE.Clock();

    const animate = () => {
      const t = clock.getElapsedTime();
      const dive = diveProgressRef.current || 0;

      camera.position.x += (mouse.x * 10 - camera.position.x) * 0.025;
      camera.position.y = -dive * 600 + Math.sin(t * 0.2) * 2.5 + (-mouse.y * 5);
      camera.lookAt(0, camera.position.y - 5, 0);

      scene.fog.density = 0.002 + dive * 0.0045;
      const surfaceColor = new THREE.Color(0x04121f);
      const abyssColor = new THREE.Color(0x000204);
      const currentBg = surfaceColor.clone().lerp(abyssColor, Math.min(dive * 1.3, 1));
      renderer.setClearColor(currentBg, 0);

      const posAttr = pGeo.attributes.position;
      for (let i = 0; i < particleCount; i++) {
        posAttr.array[i * 3 + 1] += speeds[i];
        posAttr.array[i * 3] += Math.sin(t * 0.8 + i) * 0.02;
        if (posAttr.array[i * 3 + 1] > camera.position.y + 350) {
          posAttr.array[i * 3 + 1] = camera.position.y - 350;
        }
      }
      posAttr.needsUpdate = true;

      fishes.forEach((f, i) => {
        const d = f.userData;
        d.angle += d.speed * 0.012;
        f.position.x = d.centerX + Math.cos(d.angle) * d.radius + mouse.x * 4;
        f.position.z = d.centerZ + Math.sin(d.angle) * d.radius;
        f.position.y = d.yOff + Math.sin(t * 0.6 + i) * 3.5;
        f.rotation.y = -d.angle + Math.PI / 2;
      });

      jellyGroup.children.forEach((g, i) => {
        g.position.y += Math.sin(t * g.userData.speed * 12 + g.userData.phase) * 0.03;
        g.position.x += Math.sin(t * 0.15 + i) * 0.015;
        const pLight = g.children[2];
        if (pLight) pLight.intensity = 1.0 + Math.sin(t * 2.0 + g.userData.phase) * 0.6;
      });

      particles.rotation.y = t * 0.004;

      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };

    animate();

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('resize', onResize);
      if (mount.contains(renderer.domElement)) {
        mount.removeChild(renderer.domElement);
      }
      pGeo.dispose(); pMat.dispose(); fishGeo.dispose(); fishMat.dispose();
      renderer.dispose();
    };
  }, []);

  return <div ref={mountRef} className="canvas-fixed" />;
}

/* ============================================================
   BUBBLE TRAIL CURSOR
============================================================ */
function BubbleTrail() {
  useEffect(() => {
    let lastTime = 0;
    const onMove = (e) => {
      const now = Date.now();
      if (now - lastTime < 50) return;
      lastTime = now;

      const bubble = document.createElement('div');
      bubble.className = 'fixed rounded-full pointer-events-none z-40';
      const size = 5 + Math.random() * 9;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${e.clientX - size / 2}px`;
      bubble.style.top = `${e.clientY - size / 2}px`;
      bubble.style.background = 'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(63,216,201,0.25))';
      bubble.style.border = '1px solid rgba(127,244,224,0.5)';
      bubble.style.boxShadow = '0 0 8px rgba(127,244,224,0.4)';
      document.body.appendChild(bubble);

      gsap.to(bubble, {
        y: -70 - Math.random() * 45,
        x: (Math.random() - 0.5) * 35,
        opacity: 0,
        duration: 1.5 + Math.random() * 0.5,
        ease: 'power1.out',
        onComplete: () => bubble.remove()
      });
    };
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, []);
  return null;
}

function Hero({ onDive }) {
  const typeRef = useRef(null);

  useEffect(() => {
    gsap.from("#hero-title span", { y: 90, opacity: 0, stagger: 0.05, duration: 1.2, ease: "power4.out", delay: 0.3 });
    gsap.from("#hero-sub", { y: 20, opacity: 0, duration: 1, delay: 1.1 });
    gsap.from("#dive-btn", { y: 20, opacity: 0, duration: 1, delay: 1.4 });

    const phrases = ["MCA Student @ Sona College", "Web Designer & Developer", "Cloud & Full Stack Enthusiast"];
    let pi = 0, ci = 0, deleting = false;
    const el = typeRef.current;

    const tick = () => {
      if (!el) return;
      const current = phrases[pi];
      if (!deleting) {
        ci++;
        el.textContent = current.slice(0, ci);
        if (ci === current.length) { deleting = true; setTimeout(tick, 1600); return; }
      } else {
        ci--;
        el.textContent = current.slice(0, ci);
        if (ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; }
      }
      setTimeout(tick, deleting ? 35 : 75);
    };
    const timer = setTimeout(tick, 1200);
    return () => clearTimeout(timer);
  }, []);

  return (
    <section id="hero" className="relative min-h-screen flex flex-col items-center justify-center text-center px-6 overflow-hidden">
      <div className="caustics"></div>
      
      <div className="absolute inset-0 opacity-30 pointer-events-none" style={{

/* ============================================================
   MAIN APPLICATION ROOT
============================================================ */
function App() {
  const [loading, setLoading] = useState(true);
  const [active, setActive] = useState("hero");
  const [soundOn, setSoundOn] = useState(false);
  const [dark, setDark] = useState(true);
  const diveProgressRef = useRef(0);

  useEffect(() => {
    if (loading) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setActive(entry.target.id);
        }
      });
    }, { threshold: 0.45 });

    SECTIONS.forEach(id => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });

    const st = ScrollTrigger.create({
      trigger: document.body,
      start: "top top",
      end: "bottom bottom",
      onUpdate: self => { diveProgressRef.current = self.progress; }
    });

    return () => {
      observer.disconnect();
      st.kill();
    };
  }, [loading]);

  const handleDive = () => {
    document.getElementById("about")?.scrollIntoView({ behavior: "smooth" });
  };

  return (
    <div className={dark ? "" : "opacity-95"}>
      {loading && <LoadingScreen onDone={() => setLoading(false)} />}
      
      {!loading && (
        <>
          <OceanCanvas diveProgressRef={diveProgressRef} />
          <BubbleTrail />
          <SideNav active={active} soundOn={soundOn} setSoundOn={setSoundOn} dark={dark} setDark={setDark} />
          
          <main className="relative z-10">
            <Hero onDive={handleDive} />
            <About />
            <Education />
            <Skills />
            <Projects />
            <Internship />
            <Certification />
            <Achievements />
            <Resume />
            <Contact />
          </main>
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
